<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>飲み会ルーレット</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif; background: #f5f5f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
#app { background: #fff; border-radius: 16px; padding: 2rem 1.5rem; max-width: 420px; width: 100%; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
h1 { font-size: 20px; font-weight: 600; color: #1a1a1a; margin-bottom: 1.5rem; text-align: center; }
#setup { display: flex; flex-direction: column; gap: 10px; }
.shop-row { display: flex; gap: 8px; align-items: center; }
.shop-row input { flex: 1; height: 38px; border: 1px solid #ddd; border-radius: 8px; padding: 0 12px; font-size: 14px; color: #1a1a1a; background: #fff; outline: none; }
.shop-row input:focus { border-color: #534AB7; }
.del-btn { width: 36px; height: 36px; border: 1px solid #ddd; border-radius: 8px; background: #fff; cursor: pointer; font-size: 16px; color: #888; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.del-btn:hover { background: #fef2f2; border-color: #fca5a5; color: #ef4444; }
#add-btn { align-self: flex-start; background: none; border: none; color: #534AB7; font-size: 14px; cursor: pointer; padding: 4px 0; }
#add-btn:hover { opacity: 0.7; }
#start-btn { margin-top: 8px; width: 100%; padding: 12px; background: #534AB7; color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; }
#start-btn:hover { background: #3C3489; }
#roulette-screen { display: none; flex-direction: column; align-items: center; gap: 1.5rem; }
#canvas-wrap { position: relative; width: 300px; height: 300px; }
canvas { border-radius: 50%; display: block; box-shadow: 0 2px 16px rgba(0,0,0,0.12); }
#pointer { position: absolute; top: -16px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-top: 22px solid #1a1a1a; }
#spin-btn { width: 100%; padding: 13px; background: #534AB7; color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; }
#spin-btn:hover { background: #3C3489; }
#spin-btn:disabled { background: #aaa; cursor: default; }
#result-box { display: none; background: #f5f3ff; border-radius: 12px; padding: 1.25rem 2rem; text-align: center; width: 100%; }
#result-label { font-size: 13px; color: #7c7c7c; margin-bottom: 6px; }
#result-name { font-size: 22px; font-weight: 700; color: #3C3489; }
#back-btn { background: none; border: none; color: #888; font-size: 13px; cursor: pointer; text-decoration: underline; }
</style>
</head>
<body>
<div id="app">
  <h1>🍺 飲み会ルーレット</h1>

  <div id="setup">
    <div id="shops-list"></div>
    <button id="add-btn">＋ お店を追加</button>
    <button id="start-btn">ルーレットを起動</button>
  </div>

  <div id="roulette-screen">
    <div id="canvas-wrap">
      <div id="pointer"></div>
      <canvas id="wheel" width="300" height="300"></canvas>
    </div>
    <div id="result-box">
      <div id="result-label">今日の飲み会は...</div>
      <div id="result-name"></div>
    </div>
    <button id="spin-btn">🎰 まわす！</button>
    <button id="back-btn">← お店リストに戻る</button>
  </div>
</div>

<script>
// ★ここにお店名を入力してください★
const DEFAULT_SHOPS = [
  "炭火焼き鳥 鳥兵衛",
  "個室居酒屋 和蔵",
  "海鮮居酒屋 漁師小屋",
  "肉バル CARNIVORE",
  "和牛焼肉 黒毛苑",
  "創作料理 月の雫",
  "クラフトビール 麦屋",
  "沖縄料理 島唄"
];

const COLORS = ["#534AB7","#0F6E56","#993C1D","#993556","#3B6D11","#854F0B","#185FA5","#A32D2D","#3C3489","#085041"];
const TEXT_COLORS = ["#EEEDFE","#E1F5EE","#FAECE7","#FBEAF0","#EAF3DE","#FAEEDA","#E6F1FB","#FCEBEB","#EEEDFE","#E1F5EE"];

let shops = [...DEFAULT_SHOPS];
let spinning = false;
let currentAngle = 0;

const setupEl = document.getElementById('setup');
const rouletteEl = document.getElementById('roulette-screen');
const shopsList = document.getElementById('shops-list');
const canvas = document.getElementById('wheel');
const ctx = canvas.getContext('2d');
const resultBox = document.getElementById('result-box');
const resultName = document.getElementById('result-name');
const spinBtn = document.getElementById('spin-btn');

function renderShopList() {
  shopsList.innerHTML = '';
  shops.forEach((s, i) => {
    const row = document.createElement('div');
    row.className = 'shop-row';
    row.innerHTML = `<input type="text" value="${s}" placeholder="お店の名前"><button class="del-btn" aria-label="削除">✕</button>`;
    row.querySelector('input').addEventListener('input', e => { shops[i] = e.target.value; });
    row.querySelector('button').addEventListener('click', () => { shops.splice(i, 1); renderShopList(); });
    shopsList.appendChild(row);
  });
}

document.getElementById('add-btn').addEventListener('click', () => {
  shops.push('');
  renderShopList();
  const inputs = shopsList.querySelectorAll('input');
  inputs[inputs.length - 1].focus();
});

document.getElementById('start-btn').addEventListener('click', () => {
  const valid = shops.filter(s => s.trim());
  if (valid.length < 2) { alert('お店を2つ以上入力してください'); return; }
  shops = valid;
  setupEl.style.display = 'none';
  rouletteEl.style.display = 'flex';
  resultBox.style.display = 'none';
  currentAngle = 0;
  drawWheel(0);
});

document.getElementById('back-btn').addEventListener('click', () => {
  rouletteEl.style.display = 'none';
  setupEl.style.display = 'flex';
  renderShopList();
});

function drawWheel(rotation) {
  const cx = 150, cy = 150, r = 145;
  const n = shops.length;
  const slice = (Math.PI * 2) / n;
  ctx.clearRect(0, 0, 300, 300);
  for (let i = 0; i < n; i++) {
    const start = rotation + i * slice - Math.PI / 2;
    const end = start + slice;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, start, end);
    ctx.closePath();
    ctx.fillStyle = COLORS[i % COLORS.length];
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(start + slice / 2);
    ctx.textAlign = 'right';
    ctx.fillStyle = TEXT_COLORS[i % TEXT_COLORS.length];
    ctx.font = `${n > 8 ? 11 : 13}px -apple-system, sans-serif`;
    const label = shops[i].length > 10 ? shops[i].slice(0, 9) + '…' : shops[i];
    ctx.fillText(label, r - 10, 4);
    ctx.restore();
  }
  ctx.beginPath();
  ctx.arc(cx, cy, 18, 0, Math.PI * 2);
  ctx.fillStyle = '#fff';
  ctx.fill();
}

spinBtn.addEventListener('click', () => {
  if (spinning) return;
  spinning = true;
  spinBtn.disabled = true;
  resultBox.style.display = 'none';
  const extraSpins = (5 + Math.floor(Math.random() * 5)) * Math.PI * 2;
  const targetOffset = Math.random() * Math.PI * 2;
  const totalRotation = extraSpins + targetOffset;
  const duration = 4000;
  const start = performance.now();
  const startAngle = currentAngle;
  function easeOut(t) { return 1 - Math.pow(1 - t, 4); }
  function animate(now) {
    const elapsed = now - start;
    const t = Math.min(elapsed / duration, 1);
    currentAngle = startAngle + totalRotation * easeOut(t);
    drawWheel(currentAngle);
    if (t < 1) {
      requestAnimationFrame(animate);
    } else {
      spinning = false;
      spinBtn.disabled = false;
      const n = shops.length;
      const slice = (Math.PI * 2) / n;
      const normalized = (((-currentAngle % (Math.PI * 2)) + Math.PI * 2) + Math.PI / 2) % (Math.PI * 2);
      const idx = Math.floor(normalized / slice) % n;
      resultName.textContent = shops[idx];
      resultBox.style.display = 'block';
    }
  }
  requestAnimationFrame(animate);
});

renderShopList();
</script>
</body>
</html>
